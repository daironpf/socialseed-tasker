name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

env:
  PYTHON_VERSION: "3.11"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.get_commit.outputs.sha }}
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: get_commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  generate-changelog:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install release tools
        run: python -m pip install jinja2 requests
      - name: Generate changelog
        env:
          RELEASE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GH_REPO: ${{ github.repository }}
        run: |
          python tools/release/changelogctl.py generate \
            --from $(git describe --tags --abbrev=0 HEAD) \
            --to ${{ github.ref_name }} \
            --out releases/${{ github.ref_name }}.md \
            --ci

  build:
    needs: generate-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build artifacts
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*

  sign:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Import GPG
        env:
          GPG_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_KEY" | base64 --decode > private.key
          gpg --batch --import private.key
      - name: Sign artifacts
        run: |
          for f in dist/*; do gpg --batch --yes --passphrase "$GPG_PASSPHRASE" -o "${f}.asc" --detach-sign "$f"; done
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: dist/*.{asc,whl,tar.gz}

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    if: ${{ secrets.PUBLISH_RELEASE == '1' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
