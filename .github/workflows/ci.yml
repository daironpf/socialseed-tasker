name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      integration:
        description: 'Run integration tests (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSIONS: "3.10,3.11,3.12"
  PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
      - name: Run ruff
        run: ruff check src/
      - name: Run black check
        run: black --check .
      - name: Run isort check
        run: isort --check-only .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          pytest -q -k "not integration" --maxfail=1 --disable-warnings

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.integration == 'true' || env.TASKER_INTEGRATION == '1' }}
    services:
      neo4j:
        image: neo4j:5.26.15-community
        env:
          NEO4J_AUTH: neo4j/neoSocial
          NEO4J_dbms_memory_heap_initial__size: 100M
          NEO4J_dbms_memory_heap_max__size: 100M
          NEO4J_dbms_memory_pagecache_size: 50M
        ports:
          - 7687:7687
        options: >-
          --health-cmd "echo 'RETURN 1' | cypher-shell -u neo4j -p neoSocial || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests
        env:
          TASKER_NEO4J_URI: "bolt://localhost:7687"
          TASKER_NEO4J_USER: "neo4j"
          TASKER_NEO4J_PASSWORD: "neoSocial"
          TASKER_INTEGRATION: "1"
        run: |
          pytest -q -m integration --maxfail=1 --disable-warnings
