name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: python -m pip install safety bandit
      - name: Run safety
        run: safety check --full-report || true
      - name: Run bandit
        run: bandit -r src -lll || true
