version: "3.8"
services:
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: tasker-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
