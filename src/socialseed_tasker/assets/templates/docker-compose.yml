# =============================================================================
# Tasker Docker Compose (Full Stack)
# =============================================================================
# For external projects: copy to your project root and run:
#
#   Direct mode (CLI connects via Bolt to Neo4j):
#     docker compose up -d
#
#   API mode (CLI connects via REST to tasker-api):
#     docker compose --profile api up -d
#
#   Full stack (API + frontend board):
#     docker compose --profile full up -d

services:

  # =============================================================================
  # Neo4j Database (Graph Database - Exclusive Storage)
  # =============================================================================
  tasker-db:
    image: neo4j:5.26.15-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neoSocial}
      - NEO4J_dbms_memory_heap_initial__size=100M
      - NEO4J_dbms_memory_heap_max__size=100M
      - NEO4J_dbms_memory_pagecache_size=50M
    volumes:
      - neo4j-data:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p neoSocial || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - tasker-net
    deploy:
      resources:
        limits:
          memory: 512M

  # =============================================================================
  # FastAPI Backend (REST API for AI agents)
  # Neo4j-only storage - graph database
  # Builds from local source for development testing
  # Note: Use 'docker compose build tasker-api' after modifying src/
  # =============================================================================
  # =============================================================================
  # FastAPI Backend (REST API for AI agents / API mode)
  # Only started when using --profile api or --profile full
  # =============================================================================
  tasker-api:
    profiles: ["api", "full"]
    build:
      context: ..
      dockerfile: tasker/Dockerfile
    image: tasker-api:local
    ports:
      - "127.0.0.1:8888:8000"
    environment:
      - TASKER_NEO4J_URI=bolt://tasker-db:7687
      - TASKER_NEO4J_USERNAME=${TASKER_NEO4J_USERNAME:-neo4j}
      - TASKER_NEO4J_PASSWORD=${TASKER_NEO4J_PASSWORD:-neoSocial}
      - TASKER_API_HOST=0.0.0.0
      - TASKER_API_PORT=8000
      - TASKER_API_KEY=${TASKER_API_KEY:-test-token}
      - TASKER_AUTH_ENABLED=${TASKER_AUTH_ENABLED:-false}
    depends_on:
      tasker-db:
        condition: service_healthy
    networks:
      - tasker-net

  # =============================================================================
  # Vue.js Frontend (Human UI - Kanban Board)
  # Builds from local frontend/ directory for proper proxy configuration
  # IMPORTANT: Run 'docker compose build tasker-board' first time
  # Or use: docker build -t tasker-board -f frontend/Dockerfile frontend/
  # Only started with --profile full
  # =============================================================================
  tasker-board:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tasker-board:local
    ports:
      - "127.0.0.1:8889:80"
    depends_on:
      - tasker-api
    networks:
      - tasker-net

networks:
  tasker-net:
    driver: bridge

volumes:
  neo4j-data: