services:

  tasker-db:
    container_name: tasker-db
    image: neo4j:5.26.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # IMPORTANT: Neo4j 5.x requires password to differ from username "neo4j" for security.
      # Using "neoSocial" as default. Do not change to "neo4j" or container will fail to start.
      - NEO4J_AUTH=neo4j/neoSocial
      - NEO4J_dbms_memory_heap_initial__size=100M
      - NEO4J_dbms_memory_heap_max__size=100M
      - NEO4J_dbms_memory_pagecache_size=50M
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_default__advertised__address=tasker-db
    volumes:
      - neo4j-data:/var/lib/neo4j/data
    healthcheck:
      test: [ "CMD-SHELL", "echo 'RETURN 1' | cypher-shell -u neo4j -p neoSocial || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - tasker-net
    deploy:
      resources:
        limits:
          memory: 512M

  tasker-db-pg:
    container_name: tasker-db-pg
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      - POSTGRES_USER=tasker
      - POSTGRES_PASSWORD=tasker
      - POSTGRES_DB=tasker
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tasker -d tasker" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tasker-net

  tasker-redis:
    container_name: tasker-redis
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tasker-net

  tasker-db-mongo:
    container_name: tasker-db-mongo
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tasker-net
    deploy:
      resources:
        limits:
          memory: 512M

  tasker-api:
    container_name: tasker-api
    image: tasker-api:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8888:8000"
    environment:
      - TASKER_NEO4J_URI=bolt://tasker-db:7687
      - TASKER_NEO4J_USERNAME=neo4j
      - TASKER_NEO4J_PASSWORD=neoSocial
      - TASKER_API_HOST=0.0.0.0
      - TASKER_API_PORT=8000
      - TASKER_API_KEY=test-token
      - TASKER_AUTH_ENABLED=true
      - GITHUB_WEBHOOK_SECRET=test-webhook-secret
      - TASKER_JWT_SECRET=tasker-local-review-secret
      - TASKER_FRONTEND_URL=http://localhost:19001
      - TASKER_DATABASE_URL=postgresql://tasker:tasker@tasker-db-pg:5432/tasker
      - TASKER_REDIS_URL=redis://tasker-redis:6379/0
      - TASKER_MONGO_URL=mongodb://tasker-db-mongo:27017/tasker_chat
      - TASKER_AUTH_SEED=true
      - TASKER_AUTH_SEED_PATH=/app/dataset/users.json
    volumes:
      - ./frontend/dataset-de-pruebas:/app/dataset:ro
    depends_on:
      tasker-db:
        condition: service_healthy
      tasker-db-pg:
        condition: service_healthy
      tasker-redis:
        condition: service_healthy
      tasker-db-mongo:
        condition: service_healthy
    networks:
      - tasker-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tasker-board:
    container_name: tasker-board
    image: tasker-board:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:19001:80"
    depends_on:
      - tasker-api
      - mock-api
    networks:
      - tasker-net

  mock-api:
    container_name: mock-api
    image: mock-api:local
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATA_DIR=/app/dataset-de-pruebas
    volumes:
      - ./frontend/dataset-de-pruebas:/app/dataset-de-pruebas
    networks:
      - tasker-net

networks:
  tasker-net:
    driver: bridge

volumes:
  neo4j-data:
  pg-data:
  redis-data:
  mongo-data:
