<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocialSeed Tasker</title>
    <script>
      // Apply dark mode immediately to prevent flash
      (function() {
        var dark = localStorage.getItem('tasker-dark-mode');
        if (dark === 'true' || (!dark && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Use relative URL so nginx proxy forwards to API
      // nginx.conf proxies /api/ to tasker-api:8000
      window.__API_URL__ = '/api/v1';
      window.__API_KEY__ = 'test-token';
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
