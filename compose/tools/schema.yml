version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: tasker-api:local
    ports:
      - "8000:8000"
  schema-registry:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: tasker-api:local
    command: ["uvicorn", "socialseed_tasker.infrastructure.web_api.app:create_app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      TASKER_SCHEMA_SERVICE: "1"
    ports:
      - "8010:8010"
    depends_on:
      - api
