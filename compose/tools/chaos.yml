version: "3.8"
services:
  api:
    image: tasker-api:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  tasker-worker:
    image: tasker-worker:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api
      - redis

  tasker-board:
    image: tasker-board:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

  chaos-agent:
    image: alpine:3.18
    command: ["sleep", "infinity"]
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
      - redis
      - tasker-worker
