version: "3.8"
services:
  neo4j:
    image: neo4j:5.26.15-community
    environment:
      NEO4J_AUTH: "neo4j/test"
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p test 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  tasker-dev:
    image: python:3.11-slim
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ./:/workspace:cached
    environment:
      TASKER_NEO4J_URI: "bolt://neo4j:7687"
      TASKER_NEO4J_USER: "neo4j"
      TASKER_NEO4J_PASSWORD: "test"
      TASKER_INTEGRATION: "1"
      TASKER_METRICS_ENABLED: "0"
    depends_on:
      neo4j:
        condition: service_healthy

  tasker-board:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    image: tasker-board:local
    environment:
      TASKER_API_URL: "http://host.docker.internal:8000"
      TASKER_AUTH_TOKEN: "${TASKER_AUTH_TOKEN:-}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  neo4j_data:
